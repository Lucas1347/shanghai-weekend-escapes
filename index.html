  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;eyebrow&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;上海七宝出发 · 2026.08.01—08.02&lt;/span&gt;
    &lt;span class=&quot;text-small&quot;&gt;天气更新：7月30日 12:00｜车次购票前以 12306 为准&lt;/span&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;div class=&quot;hero&quot; role=&quot;img&quot; aria-label=&quot;左侧黄山云峰、中间安吉竹海天池、右侧仙居山水栈桥的三联旅行意境图&quot;&gt;&lt;/div&gt;
    &lt;figcaption class=&quot;text-small&quot;&gt;黄山 / 安吉 / 仙居路线意境图（AI 生成，非实时景区画面）&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;p class=&quot;lede&quot;&gt;&lt;strong&gt;先说结论：&lt;/strong&gt;纯避暑选黄山；少爬山、想轻松选安吉；想看奇峰栈桥选仙居。下面把“周日下午 4—6 点返回”按&lt;strong&gt;返程列车发车&lt;/strong&gt;理解——三套均满足，但黄山约 19:00、仙居约 20:21 才到上海；仙居直达去程 10:02，较“8—10 点”偏晚 2 分钟。&lt;/p&gt;

  &lt;div class=&quot;viz-grid&quot; aria-label=&quot;三方案快速比较&quot;&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;h2&gt;&lt;span class=&quot;pick&quot;&gt;&lt;i data-lucide=&quot;mountain&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 黄山&lt;/span&gt;&lt;/h2&gt;
      &lt;p&gt;&lt;span class=&quot;viz-badge&quot;&gt;避暑优先&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;山顶 15—22℃&lt;/strong&gt;，但两天都有小雨；约 4—5 小时山路，体力要求最高。&lt;/p&gt;
      &lt;p class=&quot;text-small&quot;&gt;08:32 去 · 16:21 回｜住白云宾馆&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;h2&gt;&lt;span class=&quot;pick&quot;&gt;&lt;i data-lucide=&quot;trees&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 安吉&lt;/span&gt;&lt;/h2&gt;
      &lt;p&gt;&lt;span class=&quot;viz-badge&quot;&gt;轻松优先&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;天池高海拔体感较低&lt;/strong&gt;，但县城预报 37—38℃；景区与车站接驳最费时间。&lt;/p&gt;
      &lt;p class=&quot;text-small&quot;&gt;09:56 去 · 16:09 回｜住江南天池&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;h2&gt;&lt;span class=&quot;pick&quot;&gt;&lt;i data-lucide=&quot;bridge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 仙居&lt;/span&gt;&lt;/h2&gt;
      &lt;p&gt;&lt;span class=&quot;viz-badge&quot;&gt;风景优先&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;奇峰与高空栈道最强&lt;/strong&gt;，县城 36—37℃；周六到得晚，不属于纯避暑路线。&lt;/p&gt;
      &lt;p class=&quot;text-small&quot;&gt;10:02 去 · 17:17 回｜住神仙居北门&lt;/p&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend text-small&quot;&gt;
    &lt;span&gt;体力：黄山 高｜安吉 低—中｜仙居 中&lt;/span&gt;
    &lt;span&gt;末段接驳：黄山 成熟｜安吉 需包车｜仙居 需约车与行李转运&lt;/span&gt;
  &lt;/div&gt;

  &lt;article aria-labelledby=&quot;plan-huangshan&quot;&gt;
    &lt;div class=&quot;plan-head&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;plan-huangshan&quot;&gt;方案 A · 黄山｜住在山顶，把清晨留给云海&lt;/h2&gt;
        &lt;p&gt;最符合“避暑”，也是三套里节奏最紧的一套。核心策略是周六云谷索道上、周日玉屏索道下，不挑战西海大峡谷，也不强求莲花峰登顶。&lt;/p&gt;
        &lt;div class=&quot;weather&quot; aria-label=&quot;黄山本周末天气&quot;&gt;
          &lt;div class=&quot;weather-day&quot;&gt;&lt;strong&gt;周六 8月1日&lt;/strong&gt;小雨｜15—22℃｜南风微风&lt;/div&gt;
          &lt;div class=&quot;weather-day&quot;&gt;&lt;strong&gt;周日 8月2日&lt;/strong&gt;小雨｜15—22℃｜南风微风&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;text-small&quot;&gt;为黄山山顶站预报。雨雾有利于云海，但石阶湿滑；雷雨时索道和开放线路可能临时调整。&lt;/p&gt;
      &lt;/div&gt;
      &lt;figure&gt;
        &lt;div class=&quot;plan-image huangshan&quot; role=&quot;img&quot; aria-label=&quot;黄山云雾山峰意境图&quot;&gt;&lt;/div&gt;
        &lt;figcaption class=&quot;text-small&quot;&gt;山顶温差大，薄羽绒或防风层比雨伞更实用。&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rail&quot; aria-label=&quot;黄山往返列车&quot;&gt;
      &lt;div class=&quot;rail-leg&quot;&gt;&lt;strong&gt;去程 · G1509&lt;/strong&gt;上海虹桥 08:32 → 黄山北 11:01｜约 2小时29分&lt;/div&gt;
      &lt;div class=&quot;rail-leg&quot;&gt;&lt;strong&gt;返程 · G1510&lt;/strong&gt;黄山北 16:21 → 上海虹桥 19:00｜约 2小时39分&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hotel-line&quot;&gt;&lt;strong&gt;住宿首选：&lt;/strong&gt;黄山白云宾馆（天海景区）&lt;span class=&quot;text-small&quot;&gt;｜路线中点，第二天向玉屏方向下山顺路；订不到可看玉屏楼宾馆。&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;timeline&quot;&gt;
      &lt;section&gt;
        &lt;h3&gt;周六｜云谷上山&lt;/h3&gt;
        &lt;ol class=&quot;schedule&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;07:25&lt;/span&gt;七宝出发，建议地铁/网约车到虹桥，预留安检与检票。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;08:32&lt;/span&gt;G1509 发车；车上吃早饭、整理轻装。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;11:01&lt;/span&gt;到黄山北；11:20 左右乘景区专线，约 50—60 分钟到南大门换乘中心。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;12:30&lt;/span&gt;换景交车至云谷寺，约 13:10 乘云谷索道上山。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;13:30&lt;/span&gt;开始主线路，正常雨天步速约 3.5—4.5 小时。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;18:00&lt;/span&gt;抵白云宾馆；晚餐、烘干衣物，早睡。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/section&gt;
      &lt;section&gt;
        &lt;h3&gt;周日｜玉屏下山&lt;/h3&gt;
        &lt;ol class=&quot;schedule&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;04:50&lt;/span&gt;天气允许再去光明顶附近等日出；雨雾大则继续休息。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;06:30&lt;/span&gt;早餐、退房，07:15 前出发。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;07:15&lt;/span&gt;鳌鱼峰方向前进，避开中午客流。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;10:45&lt;/span&gt;到迎客松 / 玉屏楼；11:30 前乘玉屏索道下山。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;12:30&lt;/span&gt;南大门午餐；13:30 前坐专线回黄山北。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;15:00&lt;/span&gt;到站留足缓冲；16:21 发车，19:00 抵虹桥。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;p class=&quot;path&quot;&gt;&lt;strong&gt;游玩路径&lt;/strong&gt;云谷索道 → 白鹅岭 → 始信峰 → 黑虎松 → 北海 → 光明顶 → 白云宾馆 → 鳌鱼峰 → 百步云梯 → 莲花亭 → 迎客松 → 玉屏索道。&lt;span class=&quot;text-small&quot;&gt;飞来石仅在 16:00 前、体力和天气都允许时加；不建议这次塞入西海大峡谷。&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;notes&quot;&gt;
      &lt;p&gt;&lt;strong&gt;必须提前：&lt;/strong&gt;实名分时预约景区门票、两段索道、山顶酒店；确认南大门接驳末班信息。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;装备：&lt;/strong&gt;防滑徒步鞋、分体雨衣、背包防雨罩、速干衣、防风保暖层、登山杖；只背一晚用品。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article aria-labelledby=&quot;plan-anji&quot;&gt;
    &lt;div class=&quot;plan-head&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;plan-anji&quot;&gt;方案 B · 安吉｜江南天池住一晚，瀑布只走精华段&lt;/h2&gt;
        &lt;p&gt;高铁最省力，难点反而是安吉站到天荒坪约 58 公里的山路。建议周六、周日用同一辆包车，别把希望押在山顶临时叫车。&lt;/p&gt;
        &lt;div class=&quot;weather&quot; aria-label=&quot;安吉本周末天气&quot;&gt;
          &lt;div class=&quot;weather-day&quot;&gt;&lt;strong&gt;周六 8月1日&lt;/strong&gt;小雨转晴｜24—38℃｜西南风微风&lt;/div&gt;
          &lt;div class=&quot;weather-day&quot;&gt;&lt;strong&gt;周日 8月2日&lt;/strong&gt;小雨转多云｜24—37℃｜西南风微风&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;text-small&quot;&gt;为安吉县城站预报。江南天池海拔约 908 米，通常比县城凉，但不是“自动减 6℃”的固定公式，中午仍需防晒防暑。&lt;/p&gt;
      &lt;/div&gt;
      &lt;figure&gt;
        &lt;div class=&quot;plan-image anji&quot; role=&quot;img&quot; aria-label=&quot;安吉湖泊竹海意境图&quot;&gt;&lt;/div&gt;
        &lt;figcaption class=&quot;text-small&quot;&gt;天池看晚景，第二天瀑布走下半段，强度可控。&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rail&quot; aria-label=&quot;安吉往返列车&quot;&gt;
      &lt;div class=&quot;rail-leg&quot;&gt;&lt;strong&gt;去程 · G1979&lt;/strong&gt;上海虹桥 09:56 → 安吉 11:25｜约 1小时29分&lt;/div&gt;
      &lt;div class=&quot;rail-leg&quot;&gt;&lt;strong&gt;返程 · G3241&lt;/strong&gt;安吉 16:09 → 上海松江 17:20｜约 1小时11分&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hotel-line&quot;&gt;&lt;strong&gt;住宿首选：&lt;/strong&gt;安吉江南天池酒店（天荒坪镇横路村）&lt;span class=&quot;text-small&quot;&gt;｜离天池近，位置胜过新旧程度；更在意房间品质可看那鹿湾·天池之巅美墅。&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;timeline&quot;&gt;
      &lt;section&gt;
        &lt;h3&gt;周六｜天池与山顶晚景&lt;/h3&gt;
        &lt;ol class=&quot;schedule&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;08:45&lt;/span&gt;七宝出发前往上海虹桥。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;09:56&lt;/span&gt;G1979 发车；11:25 抵安吉站。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;11:40&lt;/span&gt;预订车辆接站，盘山路约 1小时20分—1小时40分。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;13:15&lt;/span&gt;酒店寄存行李、午餐，避开最热时段。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;15:00&lt;/span&gt;江南天池环线、观景台与竹海公路观景点，约 2.5 小时。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;18:00&lt;/span&gt;天气好看晚霞；19:00 回酒店晚餐。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/section&gt;
      &lt;section&gt;
        &lt;h3&gt;周日｜藏龙百瀑轻徒步&lt;/h3&gt;
        &lt;ol class=&quot;schedule&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;07:30&lt;/span&gt;早餐、退房，行李放包车。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;08:30&lt;/span&gt;前往大溪村 / 藏龙百瀑，约 30—40 分钟。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;09:10&lt;/span&gt;只走下部到中部瀑布精华段，约 2 小时，雨后不追求全程登高。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;11:30&lt;/span&gt;大溪村午餐，补水休息。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;13:10&lt;/span&gt;最晚出发去安吉站；目标 14:45 前到站。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;16:09&lt;/span&gt;G3241 发车，17:20 抵上海松江；转地铁 9 号线回七宝最顺。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;p class=&quot;path&quot;&gt;&lt;strong&gt;游玩路径&lt;/strong&gt;安吉站 → 天荒坪盘山路 → 江南天池 → 天池观景台 → 山顶晚景 → 江南天池酒店 → 大溪村 → 藏龙百瀑下 / 中段 → 安吉站 → 上海松江。&lt;span class=&quot;text-small&quot;&gt;如周日持续雷雨，取消瀑布登高，改为酒店周边竹海散步后提前去站。&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;notes&quot;&gt;
      &lt;p&gt;&lt;strong&gt;必须提前：&lt;/strong&gt;约定接站、第二天送站和全天价格，并写清“江南天池—藏龙百瀑—安吉站”路线；山路易晕车者带药。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;装备：&lt;/strong&gt;遮阳帽、防晒、驱蚊、防滑鞋、雨衣；不要进入无管理的野溪和深潭。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article aria-labelledby=&quot;plan-xianju&quot;&gt;
    &lt;div class=&quot;plan-head&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;plan-xianju&quot;&gt;方案 C · 仙居｜北门早进、南门出，一次走完核心栈道&lt;/h2&gt;
        &lt;p&gt;周六 13:03 才到，首日不硬塞远景点；把主景区放到周日一早。它是“景观型周末”，不是温度型避暑，11 点后要认真防高温。&lt;/p&gt;
        &lt;div class=&quot;weather&quot; aria-label=&quot;仙居本周末天气&quot;&gt;
          &lt;div class=&quot;weather-day&quot;&gt;&lt;strong&gt;周六 8月1日&lt;/strong&gt;小雨转晴｜24—36℃｜东风微风&lt;/div&gt;
          &lt;div class=&quot;weather-day&quot;&gt;&lt;strong&gt;周日 8月2日&lt;/strong&gt;小雨转多云｜26—37℃｜东风微风&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;text-small&quot;&gt;为仙居县城站预报；山体和林荫处体感稍低，但高空栈道暴晒。周日上午尽量完成裸露路段。&lt;/p&gt;
      &lt;/div&gt;
      &lt;figure&gt;
        &lt;div class=&quot;plan-image xianju&quot; role=&quot;img&quot; aria-label=&quot;仙居山水与步桥意境图&quot;&gt;&lt;/div&gt;
        &lt;figcaption class=&quot;text-small&quot;&gt;北上南下少回头，但必须提前解决行李与接车。&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rail&quot; aria-label=&quot;仙居往返列车&quot;&gt;
      &lt;div class=&quot;rail-leg&quot;&gt;&lt;strong&gt;去程 · D3205&lt;/strong&gt;上海虹桥 10:02 → 仙居 13:03｜约 3小时01分&lt;/div&gt;
      &lt;div class=&quot;rail-leg&quot;&gt;&lt;strong&gt;返程 · D3206 / D3207&lt;/strong&gt;仙居 17:17 → 上海虹桥 20:21｜约 3小时04分&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hotel-line&quot;&gt;&lt;strong&gt;住宿首选：&lt;/strong&gt;神仙居君澜度假酒店（白塔镇、景区北门区域）&lt;span class=&quot;text-small&quot;&gt;｜第二天可抢早入园；订房时确认具体房型、接送及行李转运。&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;timeline&quot;&gt;
      &lt;section&gt;
        &lt;h3&gt;周六｜古村与酒店慢下来&lt;/h3&gt;
        &lt;ol class=&quot;schedule&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;08:55&lt;/span&gt;七宝出发前往上海虹桥。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;10:02&lt;/span&gt;D3205 发车；车上早午餐，减少到站后耽搁。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;13:03&lt;/span&gt;抵仙居站；约车到白塔 / 神仙居北门，约 45—60 分钟。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;14:15&lt;/span&gt;酒店寄存行李、补充午餐，避开高温。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;15:45&lt;/span&gt;高迁古民居慢逛约 1.5 小时；若雨大则改为酒店休息。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;18:00&lt;/span&gt;回酒店晚餐；与司机 / 前台确认第二天行李在南门交接。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/section&gt;
      &lt;section&gt;
        &lt;h3&gt;周日｜神仙居北进南出&lt;/h3&gt;
        &lt;ol class=&quot;schedule&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;06:30&lt;/span&gt;早餐、退房；小行李交司机，不背大箱上山。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;07:30&lt;/span&gt;北门入园，北海索道上，争取第一波客流。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;08:10&lt;/span&gt;开始核心栈道，约 3.5—4.5 小时，按天气删减支线。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;12:15&lt;/span&gt;南天索道下，13:00 左右南门与司机及行李会合。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;13:20&lt;/span&gt;白塔镇午餐；15:20 前出发去仙居站。&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;time&quot;&gt;17:17&lt;/span&gt;D3206 / D3207 发车，约 20:21 抵上海虹桥。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;p class=&quot;path&quot;&gt;&lt;strong&gt;游玩路径&lt;/strong&gt;北门 → 北海索道 → 如意桥 → 蟠桃园 → 卧龙桥 → 圆梦桥 → 莲花台 → 南天桥 / 南天顶主线 → 南天索道 → 南门。&lt;span class=&quot;text-small&quot;&gt;高温或雷雨时跳过南天顶支线；北进南出前提是包车把行李送到南门。&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;notes&quot;&gt;
      &lt;p&gt;&lt;strong&gt;必须提前：&lt;/strong&gt;景区票与双程索道、酒店、仙居站接送车；把“北门放人、南门接人并带行李”写进约车确认。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;装备：&lt;/strong&gt;防晒袖套、遮阳帽、雨衣、防滑鞋、足量电解质饮料；高空栈道遇雷电按景区广播撤离。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;section class=&quot;decision&quot; aria-label=&quot;最终选择建议&quot;&gt;
    &lt;h2&gt;怎么选&lt;/h2&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;你的优先级&lt;/th&gt;&lt;th&gt;建议&lt;/th&gt;&lt;th&gt;关键代价&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;真的想凉快&lt;/td&gt;&lt;td&gt;&lt;strong&gt;黄山&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;雨天爬山、酒店与门票最难订&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;亲子 / 少走路 / 想早点到家&lt;/td&gt;&lt;td&gt;&lt;strong&gt;安吉&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;包车距离长，县城仍是高温&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;第一次去、最看重景观&lt;/td&gt;&lt;td&gt;&lt;strong&gt;仙居&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;周六有效游玩时间短，返沪较晚&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-small&quot;&gt;车次时刻可能因调图、停运或售票日期变化；下单时请以中国铁路 12306 为最终依据。山岳景区遇雷雨可能临时关闭索道、栈道或部分峰区。&lt;/p&gt;
  &lt;/section&gt;

    &lt;a href=&quot;https://m.nmc.cn/publish/forecast/AZJ/anji.html&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;中央气象台·安吉&lt;/a&gt;

&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
